[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Security headers are defined once, in next.config.js `headers()`, so that the
# Content-Security-Policy cannot drift between hosting providers. Do not re-add
# them here: two CSP headers are enforced as an intersection, not a union.

[[headers]]
  for = "/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/webfonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://musadaq.live"

[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "https://musadaq.live" 